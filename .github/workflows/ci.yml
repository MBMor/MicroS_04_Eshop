name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  quality-policy:
    name: Quality policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate governed test tiers
        run: python scripts/quality/test_tiers.py validate

      - name: Test tier policy tooling
        run: python -m unittest discover -s scripts/quality/tests -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Restore API Gateway integration tests
        run: >
          dotnet restore
          tests/backend/integration/ApiGateway.IntegrationTests/ApiGateway.IntegrationTests.csproj

      - name: Restore messaging integration tests
        run: >
          dotnet restore
          tests/backend/integration/Eshop.Messaging.IntegrationTests/Eshop.Messaging.IntegrationTests.csproj
          
      - name: Restore domain unit tests
        run: >
          dotnet restore
          tests/backend/unit/Eshop.Domain.UnitTests/Eshop.Domain.UnitTests.csproj

      - name: Restore Basket Service
        run: >
          dotnet restore
          src/backend/services/BasketService/BasketService.csproj

      - name: Restore Catalog Service
        run: >
          dotnet restore
          src/backend/services/CatalogService/CatalogService.csproj

      - name: Restore RabbitMQ topology initializer
        run: >
          dotnet restore
          src/backend/tools/RabbitMq.TopologyInitializer/RabbitMq.TopologyInitializer.csproj

      - name: Restore Basket Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/BasketService.IntegrationTests/BasketService.IntegrationTests.csproj

      - name: Restore Catalog Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/CatalogService.IntegrationTests/CatalogService.IntegrationTests.csproj

      - name: Restore Orders Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/OrdersService.IntegrationTests/OrdersService.IntegrationTests.csproj

      - name: Restore Inventory Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/InventoryService.IntegrationTests/InventoryService.IntegrationTests.csproj

      - name: Restore Payments Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/PaymentsService.IntegrationTests/PaymentsService.IntegrationTests.csproj

      - name: Restore Notifications Service integration tests
        run: >
          dotnet restore
          tests/backend/integration/NotificationsService.IntegrationTests/NotificationsService.IntegrationTests.csproj

      - name: Build API Gateway integration tests
        run: >
          dotnet build
          tests/backend/integration/ApiGateway.IntegrationTests/ApiGateway.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build messaging integration tests
        run: >
          dotnet build
          tests/backend/integration/Eshop.Messaging.IntegrationTests/Eshop.Messaging.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build domain unit tests
        run: >
          dotnet build
          tests/backend/unit/Eshop.Domain.UnitTests/Eshop.Domain.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Build Basket Service
        run: >
          dotnet build
          src/backend/services/BasketService/BasketService.csproj
          --configuration Release
          --no-restore

      - name: Build Catalog Service
        run: >
          dotnet build
          src/backend/services/CatalogService/CatalogService.csproj
          --configuration Release
          --no-restore

      - name: Build RabbitMQ topology initializer
        run: >
          dotnet build
          src/backend/tools/RabbitMq.TopologyInitializer/RabbitMq.TopologyInitializer.csproj
          --configuration Release
          --no-restore

      - name: Build Basket Service integration tests
        run: >
          dotnet build
          tests/backend/integration/BasketService.IntegrationTests/BasketService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build Catalog Service integration tests
        run: >
          dotnet build
          tests/backend/integration/CatalogService.IntegrationTests/CatalogService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build Orders Service integration tests
        run: >
          dotnet build
          tests/backend/integration/OrdersService.IntegrationTests/OrdersService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build Inventory Service integration tests
        run: >
          dotnet build
          tests/backend/integration/InventoryService.IntegrationTests/InventoryService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build Payments Service integration tests
        run: >
          dotnet build
          tests/backend/integration/PaymentsService.IntegrationTests/PaymentsService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Build Notifications Service integration tests
        run: >
          dotnet build
          tests/backend/integration/NotificationsService.IntegrationTests/NotificationsService.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Run domain unit tests
        run: >
          dotnet test
          tests/backend/unit/Eshop.Domain.UnitTests/Eshop.Domain.UnitTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=domain-unit-tests.trx"
          --logger
          "junit;LogFileName=domain-unit-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/unit

      - name: Run API Gateway integration tests
        run: >
          dotnet test
          tests/backend/integration/ApiGateway.IntegrationTests/ApiGateway.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=api-gateway-integration-tests.trx"
          --logger
          "junit;LogFileName=api-gateway-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/api-gateway

      - name: Run Basket Service integration tests
        run: >
          dotnet test
          tests/backend/integration/BasketService.IntegrationTests/BasketService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=basket-service-integration-tests.trx"
          --logger
          "junit;LogFileName=basket-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/basket-service

      - name: Run messaging integration tests
        run: |
          dotnet test \
            tests/backend/integration/Eshop.Messaging.IntegrationTests/Eshop.Messaging.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=messaging-integration-tests.trx" \
            --logger "junit;LogFileName=messaging-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose" \
            --diag artifacts/test-results/messaging/vstest-diagnostic.log \
            --results-directory artifacts/test-results/messaging

      - name: Run Catalog Service integration tests
        run: >
          dotnet test
          tests/backend/integration/CatalogService.IntegrationTests/CatalogService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=catalog-service-integration-tests.trx"
          --logger
          "junit;LogFileName=catalog-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/catalog-service

      - name: Run Orders Service integration tests
        run: >
          dotnet test
          tests/backend/integration/OrdersService.IntegrationTests/OrdersService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=orders-service-integration-tests.trx"
          --logger
          "junit;LogFileName=orders-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/orders-service

      - name: Run Inventory Service integration tests
        run: >
          dotnet test
          tests/backend/integration/InventoryService.IntegrationTests/InventoryService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=inventory-service-integration-tests.trx"
          --logger
          "junit;LogFileName=inventory-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/inventory-service

      - name: Run Payments Service integration tests
        run: >
          dotnet test
          tests/backend/integration/PaymentsService.IntegrationTests/PaymentsService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=payments-service-integration-tests.trx"
          --logger
          "junit;LogFileName=payments-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/payments-service

      - name: Run Notifications Service integration tests
        run: >
          dotnet test
          tests/backend/integration/NotificationsService.IntegrationTests/NotificationsService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger
          "trx;LogFileName=notifications-service-integration-tests.trx"
          --logger
          "junit;LogFileName=notifications-service-integration-tests.junit.xml;MethodFormat=Default;FailureBodyFormat=Verbose"
          --results-directory
          artifacts/test-results/notifications-service

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.junit.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Display Node.js information
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:junit

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: artifacts/test-results/frontend/*.junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        run: npm run build

  containers:
    name: Container images

    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Docker Bake definition
        run: >
          docker buildx bake
          --file docker-bake.hcl
          --print

      - name: Build application container images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          pull: true

  e2e:
    name: Checkout E2E

    needs:
      - containers

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Verify Docker availability
        run: |
          docker version
          docker info
          docker compose version

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Make E2E scripts executable
        run: chmod +x scripts/e2e/*.sh

      - name: Start full E2E stack
        run: ./scripts/e2e/start-stack.sh

      - name: Run checkout E2E tests
        working-directory: tests/e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:5173
        run: npm test

      - name: Stop E2E stack
        if: always()
        run: ./scripts/e2e/stop-stack.sh

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkout-e2e-diagnostics
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 7

  testrail:
    name: Publish TestRail results
    needs:
      - backend
      - frontend
      - e2e
    if: ${{ always() && github.event_name != 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TESTRAIL_HOST: ${{ vars.TESTRAIL_HOST }}
      TESTRAIL_PROJECT: ${{ vars.TESTRAIL_PROJECT }}
      TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
      TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate TestRail configuration
        shell: bash
        run: |
          missing=0
          for variable in TESTRAIL_HOST TESTRAIL_PROJECT TESTRAIL_USERNAME TESTRAIL_API_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required GitHub secret or variable is empty: ${variable}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install pinned TRCLI
        run: python -m pip install --disable-pip-version-check --no-input trcli==1.15.1

      - name: Download backend test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: backend-test-results
          path: artifacts/download/backend

      - name: Download frontend test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-test-results
          path: artifacts/download/frontend

      - name: Download Checkout E2E diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: checkout-e2e-diagnostics
          path: artifacts/download/e2e

      - name: Aggregate raw results by TestIntent
        run: >
          python scripts/testrail/prepare_ci_results.py
          --backend-root artifacts/download/backend
          --frontend-root artifacts/download/frontend
          --e2e-root artifacts/download/e2e
          --output-dir artifacts/testrail

      - name: Validate Automation IDs exist uniquely in TestRail
        shell: bash
        run: |
          shopt -s nullglob
          reports=(
            artifacts/testrail/backend-unit.junit.xml
            artifacts/testrail/backend-integration.junit.xml
            artifacts/testrail/frontend-unit.junit.xml
            artifacts/testrail/checkout-e2e.junit.xml
          )
          existing=()
          for report in "${reports[@]}"; do
            [[ -f "$report" ]] && existing+=("$report")
          done
          if (( ${#existing[@]} == 0 )); then
            echo "::error::No aggregated JUnit reports are available for TestRail"
            exit 1
          fi
          python scripts/testrail/validate_testrail_automation_ids.py \
            --host "$TESTRAIL_HOST" \
            --project "$TESTRAIL_PROJECT" \
            --username "$TESTRAIL_USERNAME" \
            --api-key "$TESTRAIL_API_KEY" \
            "${existing[@]}"

      - name: Publish separate TestRail runs
        shell: bash
        env:
          TESTRAIL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          publish_report() {
            local report="$1"
            local area="$2"
            if [[ ! -f "$report" ]]; then
              echo "::warning::${area}: aggregate report is absent; run skipped"
              return 0
            fi
            trcli \
              -y \
              -n \
              -h "$TESTRAIL_HOST" \
              --project "$TESTRAIL_PROJECT" \
              -u "$TESTRAIL_USERNAME" \
              -k "$TESTRAIL_API_KEY" \
              parse_junit \
              -f "$report" \
              --title "CI #${GITHUB_RUN_NUMBER} | ${area}" \
              --run-description "GitHub Actions run: ${TESTRAIL_RUN_URL}" \
              --close-run
          }

          publish_report artifacts/testrail/backend-unit.junit.xml "Backend Unit"
          publish_report artifacts/testrail/backend-integration.junit.xml "Backend Integration"
          publish_report artifacts/testrail/frontend-unit.junit.xml "Frontend Unit"
          publish_report artifacts/testrail/checkout-e2e.junit.xml "Checkout E2E"

      - name: Upload TestRail transformation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testrail-junit-results
          path: artifacts/testrail/
          if-no-files-found: warn
          retention-days: 7
